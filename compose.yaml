services:
  servico:
    build: .
    image: servico-so:1.0
    container_name: servico-so
    env_file: .env
    ports:
      - "${HOST_PORT:-8080}:${PORT:-8080}"
    restart: on-failure
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 50
    privileged: false
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
